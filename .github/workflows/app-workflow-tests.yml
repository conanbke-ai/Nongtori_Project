name: App workflow tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'db/**'
      - 'drizzle/**'
      - 'tests/**'
      - 'package.json'
      - 'eslint.config.mjs'
      - '.github/workflows/app-workflow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Workflow tests
        run: npm run test:workflows
      - name: Lint
        run: npm run lint
