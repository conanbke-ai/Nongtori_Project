name: Data Pipeline Tests

on:
  pull_request:
    paths:
      - 'ml/data_pipeline/**'
      - 'tests/test_*.py'
      - '.github/workflows/data-pipeline-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ml/data_pipeline/**'
      - 'tests/test_*.py'
      - '.github/workflows/data-pipeline-tests.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q ml/data_pipeline tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Registry CLI smoke
        run: python -m ml.data_pipeline.cli list
