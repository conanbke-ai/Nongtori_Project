name: KGCV Live Metadata Audit

on:
  pull_request:
    paths:
      - 'ml/data_pipeline/hf_metadata_audit.py'
      - 'ml/data_pipeline/kgcv_manifest.py'
      - 'tests/test_kgcv_manifest.py'
      - '.github/workflows/kgcv-live-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit KGCV metadata only
        run: python -m ml.data_pipeline.hf_metadata_audit --output artifacts/kgcv_hf_metadata_audit.json
      - name: Build normalized metadata manifest
        run: python -m ml.data_pipeline.kgcv_manifest --output artifacts/kgcv_normalized_manifest.csv --summary artifacts/kgcv_normalized_summary.json
      - name: Upload audit and normalized manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgcv-normalized-metadata
          path: |
            artifacts/kgcv_hf_metadata_audit.json
            artifacts/kgcv_normalized_manifest.csv
            artifacts/kgcv_normalized_summary.json
          if-no-files-found: warn
