data:
  date_column: date
  target_column: price_per_kg
  group_columns:
    - market_code
    - crop_code
    - cultivar_code
    - grade_code
    - package_unit
  observed_numeric_columns:
    - trade_volume_kg
    - temperature_mean_c
    - precipitation_mm
    - humidity_mean_pct
model:
  forecast_horizons: [1, 3, 7]
  quantiles: [0.1, 0.5, 0.9]
  max_encoder_length: 56
  max_prediction_length: 7
validation:
  holdout_days: 60
  random_seed: 42
